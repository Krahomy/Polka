<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polka</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Polka" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#F8F8F8" />
    <script>
      if (
        window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true
      ) {
        document.querySelector('meta[name="viewport"]').setAttribute(
          'content',
          'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'
        );
      }

      // iOS shows a text-selection loupe on double tap even with user-select: none.
      // The gesture starts on the second touchstart, so cancel that touch
      // (and its touchend) everywhere except text fields.
      (function () {
        var lastTouchStart = 0;
        var isSecondTap = false;
        var isTextField = function (e) {
          var t = e.target;
          return t && t.closest && t.closest('input, textarea, [contenteditable="true"]');
        };
        document.addEventListener('touchstart', function (e) {
          var now = Date.now();
          isSecondTap = now - lastTouchStart < 350 && e.touches.length === 1 && !isTextField(e);
          lastTouchStart = now;
          if (isSecondTap) e.preventDefault();
        }, { passive: false, capture: true });
        document.addEventListener('touchend', function (e) {
          if (isSecondTap) e.preventDefault();
        }, { passive: false, capture: true });
        document.addEventListener('dblclick', function (e) { if (!isTextField(e)) e.preventDefault(); }, { capture: true });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
