<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polka</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Polka" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#F8F8F8" />
    <script>
      if (
        window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true
      ) {
        document.querySelector('meta[name="viewport"]').setAttribute(
          'content',
          'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'
        );
      }

      // iOS shows a text-selection loupe on double tap even with user-select: none.
      // Cancel the second tap of a double tap everywhere except text fields.
      (function () {
        var lastTouchEnd = 0;
        document.addEventListener('touchend', function (e) {
          var target = e.target;
          if (target && target.closest && target.closest('input, textarea, [contenteditable="true"]')) return;
          var now = Date.now();
          if (now - lastTouchEnd < 350) e.preventDefault();
          lastTouchEnd = now;
        }, { passive: false });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
